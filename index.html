<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Live Rate Calculator</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f4f8; padding: 20px; margin: 0; }
    .calc-card { max-width: 750px; margin: 20px auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h2 { color: #0f2942; margin-top: 0; text-align: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media(max-width: 500px){ .grid { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; background: #0066cc; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #004b99; }
    
    .result-box { margin-top: 25px; padding: 18px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
    .vol-info { font-size: 13px; color: #2b6cb0; margin-bottom: 15px; font-weight: 600; background: #ebf8ff; padding: 10px; border-radius: 6px; }
    
    .rate-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .rate-table th, .rate-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .rate-table th { background: #edf2f7; color: #2d3748; }
    .price-text { font-size: 16px; font-weight: bold; color: #0066cc; }
    .gst-text { font-size: 12px; color: #718096; font-weight: normal; }
    .badge { background: #38a169; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; margin-left: 5px; }
    .loader { display: none; text-align: center; color: #0066cc; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<div class="calc-card">
  <h2>🚢 International Shipping Rate Calculator</h2>

  <div class="form-group">
    <label>Destination Country:</label>
    <select id="country">
      <option value="UAE">UAE (United Arab Emirates)</option>
    </select>
  </div>

  <div class="grid">
    <div class="form-group">
      <label>No. of Cartons / Boxes:</label>
      <input type="number" id="cartons" value="1" min="1">
    </div>
    <div class="form-group">
      <label>Gross Weight (KG):</label>
      <input type="number" id="grossWeight" value="0.5" step="0.5">
    </div>
  </div>

  <label>Single Box Dimensions (cm):</label>
  <div class="grid">
    <input type="number" id="length" placeholder="Length" value="5">
    <input type="number" id="width" placeholder="Width" value="5">
    <input type="number" id="height" placeholder="Height" value="4">
  </div>

  <button onclick="calculateLiveRates()">Compare All Live Rates</button>
  <div class="loader" id="loader">Fetching latest rates from Google Sheets... ⏳</div>

  <div class="result-box" id="resultBox" style="display:none;">
    <div class="vol-info" id="weightSummary"></div>
    
    <table class="rate-table">
      <thead>
        <tr>
          <th>Carrier / Account</th>
          <th>ETA</th>
          <th>Subtotal</th>
          <th>GST (18%)</th>
          <th>Final Total</th>
        </tr>
      </thead>
      <tbody id="comparisonRows">
        <!-- Dynamic Live Data -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // Base CSV Link
  const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSAmLg-6alcw5asDwpcHZ7nf71y-2ITlVRzTEKHc4McYr4KDtZ06yJmRG4Wxn5uYHIpr5Y--BOM2sqk/pub?single=true&output=csv';

  // Connected Tabs
  const URL_ACC1 = BASE_URL + '&gid=0';
  const URL_ACC2 = BASE_URL + '&gid=236963727';

  async function fetchSheetData(url) {
    try {
      const response = await fetch(url);
      const csvText = await response.text();
      return parseCSV(csvText);
    } catch (e) {
      console.error("Error fetching CSV:", e);
      return null;
    }
  }

  function parseCSV(text) {
    const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
    const rates = [];
    const rules = { ESS: 1.11, ES: 0, FS: 0, PROFIT: 15, GST: 18 };

    lines.forEach(line => {
      const parts = line.split(',').map(p => p.replace(/"/g, '').trim());
      
      const wt = parseFloat(parts[0]);
      const rate = parseFloat(parts[1]);
      const type = parts[4];

      if (!isNaN(wt) && !isNaN(rate)) {
        rates.push({ wt, rate, type: type || 'FLAT' });
      }

      if (parts[0] === 'ESS') rules.ESS = parseFloat(parts[3]) || rules.ESS;
      if (parts[0] === 'ES') rules.ES = parseFloat(parts[3]) || 0;
      if (parts[0] === 'FS') rules.FS = parseFloat(parts[3]) || 0;
      if (parts[0] === 'GST') rules.GST = parseFloat(parts[3]) || rules.GST;
      if (parts[0] === 'PROFIT') rules.PROFIT = parseFloat(parts[3]) || rules.PROFIT;
    });

    return { rates, rules };
  }

  async function calculateLiveRates() {
    document.getElementById('loader').style.display = 'block';
    document.getElementById('resultBox').style.display = 'none';

    const [acc1Data, acc2Data] = await Promise.all([
      fetchSheetData(URL_ACC1),
      fetchSheetData(URL_ACC2)
    ]);

    document.getElementById('loader').style.display = 'none';

    const cartons = parseInt(document.getElementById('cartons').value) || 1;
    const grossWt = parseFloat(document.getElementById('grossWeight').value) || 0;
    const l = parseFloat(document.getElementById('length').value) || 0;
    const w = parseFloat(document.getElementById('width').value) || 0;
    const h = parseFloat(document.getElementById('height').value) || 0;

    const volWt = ((l * w * h) / 5000) * cartons;
    const chargeableWt = Math.max(grossWt, volWt);

    const accountsList = [
      { name: 'Aramex (Account 1)', eta: '5-7 Days', data: acc1Data },
      { name: 'Aramex (Account 2)', eta: '5-7 Days', data: acc2Data }
    ];

    let rowsHTML = '';

    accountsList.forEach(acc => {
      if (!acc.data || acc.data.rates.length === 0) return;

      const { rates, rules } = acc.data;
      let baseFreight = 0;

      if (chargeableWt <= 20) {
        let matched = rates.find(r => r.wt >= chargeableWt && r.type === 'FLAT');
        baseFreight = matched ? matched.rate : (chargeableWt * 160);
      } else {
        let perKgObj = rates.find(r => r.wt > 20);
        baseFreight = chargeableWt * (perKgObj ? perKgObj.rate : 133);
      }

      const essCost = chargeableWt * rules.ESS;
      const esCost = (baseFreight * rules.ES) / 100;
      const fsCost = (baseFreight * rules.FS) / 100;

      const totalCarrierCost = baseFreight + essCost + esCost + fsCost;
      const sellingSubtotal = totalCarrierCost * (1 + (rules.PROFIT / 100));
      const gstAmount = (sellingSubtotal * rules.GST) / 100;
      const grandTotal = sellingSubtotal + gstAmount;

      const fmt = (num) => '₹' + num.toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });

      rowsHTML += `
        <tr>
          <td><strong>${acc.name}</strong> <span class="badge">Live Sync</span></td>
          <td>${acc.eta}</td>
          <td>${fmt(sellingSubtotal)}</td>
          <td style="color: #e53e3e; font-weight: 600;">+ ${fmt(gstAmount)}</td>
          <td class="price-text">${fmt(grandTotal)}</td>
        </tr>
      `;
    });

    document.getElementById('weightSummary').innerText = 
      `Actual Wt: ${grossWt} KG | Volumetric Wt: ${volWt.toFixed(2)} KG | Chargeable Wt: ${chargeableWt.toFixed(2)} KG`;

    document.getElementById('comparisonRows').innerHTML = rowsHTML;
    document.getElementById('resultBox').style.display = 'block';
  }
</script>

</body>
</html>
