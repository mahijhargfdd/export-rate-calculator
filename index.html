<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Freight Rate Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .table-custom { background: #fff; border-radius: 10px; overflow: hidden; }
    .table-custom th { background-color: #0d6efd; color: white; border: none; }
    .cheapest-row { background-color: #d1e7dd !important; font-weight: bold; }
    .badge-cheapest { background-color: #198754; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container py-4">
  <h2 class="text-center mb-4 fw-bold text-primary">Multi-Carrier Shipping Rate Calculator</h2>
  
  <!-- Form Card -->
  <div class="card p-4 mb-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label fw-semibold">Select Country</label>
        <select id="countrySelect" class="form-select">
          <option value="">-- Loading Countries --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Chargeable Weight (KG)</label>
        <input type="number" id="weightInput" class="form-control" placeholder="e.g. 0.25, 1.5, 7" step="0.01" min="0.01">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button id="calcBtn" class="btn btn-primary w-100 fw-bold py-2">Calculate Live Rates</button>
      </div>
    </div>
  </div>

  <!-- Results Section -->
  <div id="resultsCard" class="card p-4 d-none">
    <h4 class="mb-3 text-secondary">Available Carrier Rates</h4>
    <div class="table-responsive">
      <table class="table table-hover align-middle table-custom">
        <thead>
          <tr>
            <th>Carrier / Service</th>
            <th>Base Freight</th>
            <th>Addons & Charges</th>
            <th>GST / Tax</th>
            <th>Total Cost</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ratesTableBody">
          <!-- Live Calculated Rows Will Be Inserted Here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Spreadsheet Config
  const SHEET_ID = '1VUF4UxBlyCUIlezfCIDRTD6jEKxObWDtWHf5VRv-Mso';
  
  const CONFIG = {
    Country_Map_GID: '0', 
    ShipGlobal_Direct: { rateGID: '436153582', addonGID: '2079126276' },
    ShipGlobal_Premium: { rateGID: '138538271', addonGID: '691225953' },
    ShipGlobal_FirstClass: { rateGID: '292821845', addonGID: '388094128' },
    ShipGlobal_Express: { rateGID: '753031239', addonGID: '20003784' }
  };

  let countryMapData = [];

  // Fetch Google Sheet CSV Data
  async function fetchCSV(gid) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
    const response = await fetch(url);
    const text = await response.text();
    return parseCSV(text);
  }

  function parseCSV(text) {
    const lines = text.split('\n').filter(line => line.trim() !== '');
    return lines.map(line => {
      const re = /(?!\s*$)\s*(?:'([^'\\]*(?:\\[\s\S][^'\\]*)*)'|"([^"\\]*(?:\\[\s\S][^"\\]*)*)"|([^,'"\s\\]*(?:\s+[^,'"\s\\]+)*))\s*(?:,|$)/g;
      const arr = [];
      line.replace(re, (m0, m1, m2, m3) => {
        if (m1 !== undefined) arr.push(m1.replace(/\\'/g, "'"));
        else if (m2 !== undefined) arr.push(m2.replace(/\\"/g, '"'));
        else if (m3 !== undefined) arr.push(m3);
        else arr.push('');
        return '';
      });
      return arr;
    });
  }

  // Initial Load - Country Dropdown Setup
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      countryMapData = await fetchCSV(CONFIG.Country_Map_GID);
      const countrySelect = document.getElementById('countrySelect');
      countrySelect.innerHTML = '<option value="">-- Select Destination --</option>';
      
      const countries = new Set();
      for (let i = 1; i < countryMapData.length; i++) {
        if (countryMapData[i][0]) countries.add(countryMapData[i][0].trim());
      }
      
      Array.from(countries).sort().forEach(country => {
        const opt = document.createElement('option');
        opt.value = country;
        opt.textContent = country;
        countrySelect.appendChild(opt);
      });
    } catch (e) {
      console.error("Error loading initial data:", e);
      alert("Failed to load country mapping sheet.");
    }
  });

  // Calculate Rates Event
  document.getElementById('calcBtn').addEventListener('click', async () => {
    const country = document.getElementById('countrySelect').value;
    const weight = parseFloat(document.getElementById('weightInput').value);

    if (!country || isNaN(weight) || weight <= 0) {
      alert("Please select a valid Country and enter Weight.");
      return;
    }

    const tableBody = document.getElementById('ratesTableBody');
    tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-3">Calculating live rates...</td></tr>';
    document.getElementById('resultsCard').classList.remove('d-none');

    const calculatedResults = [];
    const sgServices = ['ShipGlobal_Direct', 'ShipGlobal_Premium', 'ShipGlobal_FirstClass', 'ShipGlobal_Express'];

    for (let serviceKey of sgServices) {
      const cfg = CONFIG[serviceKey];
      try {
        const rates = await fetchCSV(cfg.rateGID);
        const addons = await fetchCSV(cfg.addonGID);
        
        const res = calculateShipGlobalRate(serviceKey, country, weight, rates, addons);
        if (res) calculatedResults.push(res);
      } catch (e) {
        console.warn(`Error processing ${serviceKey}:`, e);
      }
    }

    renderResults(calculatedResults);
  });

  // Calculation Logic Engine
  function calculateShipGlobalRate(serviceKey, country, weight, rates, addons) {
    const countryRow = countryMapData.find(r => r[0] && r[0].trim().toLowerCase() === country.toLowerCase());
    if (!countryRow) return null;
    
    const zoneName = countryRow[1] ? countryRow[1].trim() : ''; 
    if (!zoneName) return null;

    const rateHeaders = rates[0].map(h => h ? h.trim() : '');
    const zoneColIdx = rateHeaders.indexOf(zoneName);
    if (zoneColIdx === -1) return null;

    let baseRate = null;
    for (let i = 1; i < rates.length; i++) {
      const slabWeight = parseFloat(rates[i][0]);
      if (!isNaN(slabWeight) && Math.abs(slabWeight - weight) < 0.001) {
        const val = rates[i][zoneColIdx];
        if (val && val.trim() !== '' && !isNaN(parseFloat(val))) {
          baseRate = parseFloat(val);
        }
        break;
      }
    }

    if (baseRate === null) return null;

    const addonHeaders = addons[0].map(h => h ? h.trim() : '');
    const addonZoneColIdx = addonHeaders.indexOf(zoneName);

    let minGda = 0, perKgGda = 0, perKgGdaLE5 = null, fsPercent = 0, gstPercent = 18, profitPercent = 0;

    for (let i = 1; i < addons.length; i++) {
      const code = addons[i][0] ? addons[i][0].trim() : '';
      const val = parseFloat(addons[i][addonZoneColIdx]);

      if (code === 'MIN_GDA') minGda = isNaN(val) ? 0 : val;
      if (code === 'PER_KG_GDA') perKgGda = isNaN(val) ? 0 : val;
      if (code === 'PER_KG_GDA_LE5') perKgGdaLE5 = isNaN(val) ? null : val;
      if (code === 'FS') fsPercent = isNaN(val) ? 0 : val;
      if (code === 'GST') gstPercent = isNaN(val) ? 18 : val;
      if (code === 'PROFIT') profitPercent = isNaN(val) ? 0 : val;
    }

    let effectivePerKgGda = perKgGda;
    if (weight <= 5.0 && perKgGdaLE5 !== null && perKgGdaLE5 > 0) {
      effectivePerKgGda = perKgGdaLE5;
    }

    const gdaCharge = Math.max(minGda, weight * effectivePerKgGda);
    const fuelSurcharge = (baseRate * fsPercent) / 100;
    const subtotal = baseRate + gdaCharge + fuelSurcharge;
    const gstAmount = (subtotal * gstPercent) / 100;
    const profitAmount = (subtotal * profitPercent) / 100;

    const totalCost = subtotal + gstAmount + profitAmount;
    const formattedName = serviceKey.replace('_', ' ');

    return {
      serviceName: formattedName,
      baseRate: baseRate.toFixed(2),
      addons: (gdaCharge + fuelSurcharge).toFixed(2),
      gst: gstAmount.toFixed(2),
      totalCost: totalCost.toFixed(2),
      rawTotal: totalCost
    };
  }

  // Display Render Engine
  function renderResults(results) {
    const tableBody = document.getElementById('ratesTableBody');
    tableBody.innerHTML = '';

    if (results.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-3 text-muted">No valid rates found for the selected weight and country.</td></tr>';
      return;
    }

    results.sort((a, b) => a.rawTotal - b.rawTotal);

    results.forEach((res, index) => {
      const isCheapest = index === 0;
      const tr = document.createElement('tr');
      if (isCheapest) tr.classList.add('cheapest-row');

      tr.innerHTML = `
        <td>
          <strong>${res.serviceName}</strong>
          ${isCheapest ? '<br><span class="badge-cheapest">Best Price</span>' : ''}
        </td>
        <td>₹${res.baseRate}</td>
        <td>₹${res.addons}</td>
        <td>₹${res.gst}</td>
        <td class="fw-bold text-success">₹${res.totalCost}</td>
        <td><button class="btn btn-sm ${isCheapest ? 'btn-success' : 'btn-outline-primary'}">Select</button></td>
      `;
      tableBody.appendChild(tr);
    });
  }
</script>

</body>
</html>
